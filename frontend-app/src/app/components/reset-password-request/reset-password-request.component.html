<div class="reset-container">
  <div class="glass-card">
    <div class="brand-header">
      <span class="brand-logo">🔐</span>
      <h1>Restablecer Contraseña</h1>
      <p class="subtitle">Ingresa tu correo para recibir el enlace de recuperación</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="reset-form">
      @if (errorMessage()) {
        <div class="error-banner">⚠️ {{ errorMessage() }}</div>
      }
      @if (successMessage()) {
        <div class="success-banner">✅ {{ successMessage() }}</div>
      }

      <div class="form-group">
        <label>Correo Electrónico</label>
        <input
          type="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
          autocomplete="email"
          placeholder="restaurante@ejemplo.com"
          required
        />
      </div>

      <button type="submit" class="submit-btn" [disabled]="loading()">
        @if (!loading()) {
          <span>Enviar enlace de recuperación</span>
        }
        @if (loading()) {
          <span>Enviando...</span>
        }
      </button>
    </form>

    <div class="card-footer">
      <a [routerLink]="['/login']" class="back-link">← Volver al inicio de sesión</a>
    </div>
  </div>
</div>
